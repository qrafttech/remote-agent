<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 921" width="640" height="921" role="img" aria-label="Architecture: any trigger with gh dispatches the cloud workflow; GitHub queues each job to a free self-hosted runner on the VPS, a process that runs the job's steps on the host; two runners run two branches at once, each job a Compose project cloud-run-id with its own network, a Postgres container brought up by docker compose from the project's own docker-compose.yml and an agent container started by docker run, holding the claude session, the API and web dev server processes and headless Chromium, with no Docker socket; only the host's /opt/agent/home mount is shared; the job's last step, on the host, takes the containers down, commits, pushes the branch and opens a draft PR with GITHUB_TOKEN; the Claude app reaches either session over Remote Control.">
<style>
:root{--bg:#F4F6F3;--surface:#FFFFFF;--band:#EBEEEA;--ink:#1B2126;--muted:#5C676D;--line:#B4BCB8;--accent:#1A6E7A;--accent-soft:#DDEFF1}
@media (prefers-color-scheme:dark){:root{--bg:#14191C;--surface:#1E2528;--band:#191F22;--ink:#E3E8E5;--muted:#9AA5A9;--line:#3B464B;--accent:#62C6D1;--accent-soft:#17333A}}
.bg{fill:var(--bg)}
.band{fill:var(--band);stroke:var(--line);stroke-width:1}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.hot{stroke:var(--accent);stroke-width:1.5}
.soft{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.group{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--ink);stroke-width:1.2}
.ln-a{stroke:var(--accent)}
.dash{stroke-dasharray:5 4}
.life{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.halo{fill:var(--bg)}
.mk{fill:var(--ink)}.mk-a{fill:var(--accent)}
.t{font:12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.t.b{font-weight:600}
.m{font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
.s{font:10px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--muted)}
.a{fill:var(--accent)}
.eb{font:600 9.5px system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.09em;text-transform:uppercase;fill:var(--muted)}
.num circle{fill:var(--ink)}.num text{font:600 10px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--bg)}
</style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
  </defs>
  <rect class="bg" width="640" height="921"/>

  <rect class="band" x="12" y="12" width="616" height="92" rx="6"/>
  <text class="eb" x="24" y="31">Triggers · anything with gh, side by side</text>
  <rect class="box" x="24" y="40" width="108" height="20" rx="10"/><text class="s" x="78" y="53.5" text-anchor="middle">laptop · gh</text>
  <rect class="box" x="145" y="40" width="108" height="20" rx="10"/><text class="s" x="199" y="53.5" text-anchor="middle">Actions tab</text>
  <rect class="box" x="266" y="40" width="108" height="20" rx="10"/><text class="s" x="320" y="53.5" text-anchor="middle">another workflow</text>
  <rect class="box" x="387" y="40" width="108" height="20" rx="10"/><text class="s" x="441" y="53.5" text-anchor="middle">a bot</text>
  <rect class="box" x="508" y="40" width="108" height="20" rx="10"/><text class="s" x="562" y="53.5" text-anchor="middle">issue comment</text>
  <path class="ln" d="M78,60 V66 H562 V60 M199,60 V66 M320,60 V66 M441,60 V66"/>
  <rect class="box" x="24" y="70" width="592" height="28" rx="4"/>
  <text class="m" x="36" y="88">gh workflow run cloud --ref feat/x -f prompt="…" <tspan class="a">= cloud feat/x "…"</tspan></text>
  <text class="s" x="604" y="88" text-anchor="end">workflow dispatch</text>
  <text class="s" x="270" y="131">dispatches cloud.yml</text>

  <rect class="band" x="12" y="136" width="616" height="112" rx="6"/>
  <text class="eb" x="24" y="155">GitHub · project repository</text>
  <rect class="box" x="24" y="164" width="300" height="72" rx="4"/>
  <text class="t b" x="36" y="184">branches feat/x, feat/y</text>
  <text class="m" x="36" y="202">.github/workflows/cloud.yml</text>
  <text class="s" x="36" y="222">one job per dispatch, queued to the runner pool</text>
  <rect class="box" x="344" y="164" width="272" height="72" rx="4"/>
  <text class="t b" x="356" y="184">draft pull requests</text>
  <text class="s" x="356" y="202">one per branch · branch pushed by the last step</text>
  <text class="s" x="356" y="218">opened with the job's GITHUB_TOKEN</text>
  <text class="s" x="70" y="272">queues each job</text>
  <text class="s" x="70" y="286">to a free runner</text>
  <text class="s a" x="590" y="272" text-anchor="end">each job: push · draft PR</text>
  <text class="m" x="590" y="286" text-anchor="end">GITHUB_TOKEN</text>

  <rect class="band" x="12" y="288" width="616" height="553" rx="6"/>
  <text class="eb" x="320" y="307" text-anchor="middle">VPS · shared Debian box, Docker · runner pool</text>

  <rect class="box" x="24" y="316" width="292" height="395" rx="4"/>
  <text class="t b" x="36" y="336">runner 1</text>
  <text class="s" x="304" y="331" text-anchor="end">systemd service · one job at a time</text>
  <text class="s" x="304" y="344" text-anchor="end">runs the job's steps on the host</text>
  <rect class="group" x="36" y="356" width="268" height="319" rx="4"/>
  <text class="eb" x="48" y="374">job · feat/x</text>
  <text class="s" x="292" y="374" text-anchor="end">Compose project cloud-&lt;run id&gt;</text>
  <rect class="box" x="48" y="386" width="244" height="64" rx="4"/>
  <text class="t b" x="56" y="402">postgres</text>
  <text class="s" x="116" y="402">docker compose up</text>
  <text class="s" x="56" y="416">from docker-compose.yml as is</text>
  <text class="s" x="56" y="429">health-checked · hostname postgres</text>
  <text class="s" x="56" y="442">no published ports</text>
  <line class="ln" x1="170" y1="468" x2="170" y2="452" marker-end="url(#ak)"/>
  <rect class="box hot" x="48" y="468" width="244" height="203" rx="4"/>
  <text class="t b" x="56" y="486">agent container · docker run</text>
  <text class="s" x="56" y="500">checkout feat/x · unprivileged user</text>
  <text class="s" x="56" y="513">no Docker socket</text>
  <text class="eb" x="56" y="530">processes, not containers</text>
  <rect class="soft" x="56" y="537" width="228" height="28" rx="3"/>
  <text class="m" x="64" y="549">claude --bg --remote-control</text>
  <text class="s" x="64" y="560">the session, on feat/x</text>
  <rect class="box" x="56" y="569" width="228" height="28" rx="3"/>
  <text class="m" x="64" y="581">nest start --watch</text>
  <text class="s" x="64" y="592">API · from the repo's instructions</text>
  <rect class="box" x="56" y="601" width="228" height="28" rx="3"/>
  <text class="m" x="64" y="613">expo start --web</text>
  <text class="s" x="64" y="624">web dev server</text>
  <rect class="box" x="56" y="633" width="228" height="28" rx="3"/>
  <text class="m" x="64" y="645">chromium --headless</text>
  <text class="s" x="64" y="656">via the chrome-devtools MCP</text>
  <text class="eb" x="36" y="690">last step · on the host</text>
  <text class="s" x="36" y="703">compose down · commit · push · draft PR</text>

  <rect class="box" x="324" y="316" width="292" height="395" rx="4"/>
  <text class="t b" x="336" y="336">runner 2</text>
  <text class="s" x="604" y="331" text-anchor="end">systemd service · one job at a time</text>
  <text class="s" x="604" y="344" text-anchor="end">runs the job's steps on the host</text>
  <rect class="group" x="336" y="356" width="268" height="319" rx="4"/>
  <text class="eb" x="348" y="374">job · feat/y</text>
  <text class="s" x="592" y="374" text-anchor="end">Compose project cloud-&lt;run id&gt;</text>
  <rect class="box" x="348" y="386" width="244" height="64" rx="4"/>
  <text class="t b" x="356" y="402">postgres</text>
  <text class="s" x="416" y="402">docker compose up</text>
  <text class="s" x="356" y="416">from docker-compose.yml as is</text>
  <text class="s" x="356" y="429">health-checked · hostname postgres</text>
  <text class="s" x="356" y="442">no published ports</text>
  <line class="ln" x1="470" y1="468" x2="470" y2="452" marker-end="url(#ak)"/>
  <rect class="box hot" x="348" y="468" width="244" height="203" rx="4"/>
  <text class="t b" x="356" y="486">agent container · docker run</text>
  <text class="s" x="356" y="500">checkout feat/y · unprivileged user</text>
  <text class="s" x="356" y="513">no Docker socket</text>
  <text class="eb" x="356" y="530">processes, not containers</text>
  <rect class="soft" x="356" y="537" width="228" height="28" rx="3"/>
  <text class="m" x="364" y="549">claude --bg --remote-control</text>
  <text class="s" x="364" y="560">the session, on feat/y</text>
  <rect class="box" x="356" y="569" width="228" height="28" rx="3"/>
  <text class="m" x="364" y="581">nest start --watch</text>
  <text class="s" x="364" y="592">API · from the repo's instructions</text>
  <rect class="box" x="356" y="601" width="228" height="28" rx="3"/>
  <text class="m" x="364" y="613">expo start --web</text>
  <text class="s" x="364" y="624">web dev server</text>
  <rect class="box" x="356" y="633" width="228" height="28" rx="3"/>
  <text class="m" x="364" y="645">chromium --headless</text>
  <text class="s" x="364" y="656">via the chrome-devtools MCP</text>
  <text class="eb" x="336" y="690">last step · on the host</text>
  <text class="s" x="336" y="703">compose down · commit · push · draft PR</text>

  <path class="ln" d="M262,727 H562"/>
  <line class="ln" x1="262" y1="727" x2="262" y2="673" marker-end="url(#ak)"/>
  <line class="ln" x1="562" y1="727" x2="562" y2="673" marker-end="url(#ak)"/>
  <line class="ln" x1="262" y1="751" x2="262" y2="727"/>
  <line class="ln" x1="562" y1="751" x2="562" y2="727"/>
  <rect class="box" x="24" y="751" width="592" height="36" rx="4"/>
  <text class="m" x="32" y="766">/opt/agent/home</text>
  <text class="s" x="32" y="780">rw · agent $HOME: login · settings · rules · skills · plugins</text>
  <text class="s" x="24" y="804">only shared: this host mount and the runner pool</text>
  <text class="s" x="24" y="817">no agent container holds a key or token that can push;</text>
  <text class="s" x="24" y="830">the job's last step, on the host, pushes after the session</text>

  <rect class="box" x="217" y="853" width="206" height="60" rx="4"/>
  <text class="t b" x="229" y="873">Claude app</text>
  <text class="s" x="229" y="888">Remote Control · Code → repo/branch</text>
  <text class="s" x="229" y="902">watch · answer · stop either session</text>
  <path class="ln ln-a dash" d="M320,853 V551 H286" marker-end="url(#aa)"/>
  <path class="ln ln-a dash" d="M320,551 H354" marker-end="url(#aa)"/>
  <rect class="halo" x="234" y="733" width="172" height="13"/>
  <text class="s" x="320" y="743" text-anchor="middle">mounted into every agent container</text>

  <line class="ln" x1="260" y1="98" x2="260" y2="163" marker-end="url(#ak)"/>
  <line class="ln" x1="60" y1="236" x2="60" y2="315" marker-end="url(#ak)"/>
  <line class="ln ln-a" x1="600" y1="316" x2="600" y2="237" marker-end="url(#aa)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 866" width="640" height="866" role="img" aria-label="Architecture: any trigger with gh dispatches the cloud workflow; GitHub queues each job to a free self-hosted runner on the VPS; two runners run two branches at once, each job with its own Docker network, Postgres service container and job container holding the claude session, the API and web dev server processes and headless Chromium; only the host's /opt/agent/home and /opt/agent/seed mounts are shared; the runner pushes the branch and opens a draft PR with GITHUB_TOKEN; the Claude app reaches either session over Remote Control.">
<style>
:root{--bg:#F4F6F3;--surface:#FFFFFF;--band:#EBEEEA;--ink:#1B2126;--muted:#5C676D;--line:#B4BCB8;--accent:#1A6E7A;--accent-soft:#DDEFF1}
@media (prefers-color-scheme:dark){:root{--bg:#14191C;--surface:#1E2528;--band:#191F22;--ink:#E3E8E5;--muted:#9AA5A9;--line:#3B464B;--accent:#62C6D1;--accent-soft:#17333A}}
.bg{fill:var(--bg)}
.band{fill:var(--band);stroke:var(--line);stroke-width:1}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.hot{stroke:var(--accent);stroke-width:1.5}
.soft{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.group{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--ink);stroke-width:1.2}
.ln-a{stroke:var(--accent)}
.dash{stroke-dasharray:5 4}
.life{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.halo{fill:var(--bg)}
.mk{fill:var(--ink)}.mk-a{fill:var(--accent)}
.t{font:12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.t.b{font-weight:600}
.m{font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
.s{font:10px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--muted)}
.a{fill:var(--accent)}
.eb{font:600 9.5px system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.09em;text-transform:uppercase;fill:var(--muted)}
.num circle{fill:var(--ink)}.num text{font:600 10px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--bg)}
</style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
  </defs>
  <rect class="bg" width="640" height="866"/>

  <rect class="band" x="12" y="12" width="616" height="92" rx="6"/>
  <text class="eb" x="24" y="31">Triggers · anything with gh, side by side</text>
  <rect class="box" x="24" y="40" width="108" height="20" rx="10"/><text class="s" x="78" y="53.5" text-anchor="middle">laptop · gh</text>
  <rect class="box" x="145" y="40" width="108" height="20" rx="10"/><text class="s" x="199" y="53.5" text-anchor="middle">Actions tab</text>
  <rect class="box" x="266" y="40" width="108" height="20" rx="10"/><text class="s" x="320" y="53.5" text-anchor="middle">another workflow</text>
  <rect class="box" x="387" y="40" width="108" height="20" rx="10"/><text class="s" x="441" y="53.5" text-anchor="middle">a bot</text>
  <rect class="box" x="508" y="40" width="108" height="20" rx="10"/><text class="s" x="562" y="53.5" text-anchor="middle">issue comment</text>
  <path class="ln" d="M78,60 V66 H562 V60 M199,60 V66 M320,60 V66 M441,60 V66"/>
  <rect class="box" x="24" y="70" width="592" height="28" rx="4"/>
  <text class="m" x="36" y="88">gh workflow run cloud --ref feat/x -f prompt="…" <tspan class="a">= cloud feat/x "…"</tspan></text>
  <text class="s" x="604" y="88" text-anchor="end">workflow dispatch</text>
  <text class="s" x="270" y="131">dispatches cloud.yml</text>

  <rect class="band" x="12" y="136" width="616" height="112" rx="6"/>
  <text class="eb" x="24" y="155">GitHub · project repository</text>
  <rect class="box" x="24" y="164" width="300" height="72" rx="4"/>
  <text class="t b" x="36" y="184">branches feat/x, feat/y</text>
  <text class="m" x="36" y="202">.github/workflows/cloud.yml</text>
  <text class="s" x="36" y="222">one job per dispatch, queued to the runner pool</text>
  <rect class="box" x="344" y="164" width="272" height="72" rx="4"/>
  <text class="t b" x="356" y="184">draft pull requests</text>
  <text class="s" x="356" y="202">one per branch · branch pushed by the runner</text>
  <text class="s" x="356" y="218">opened with the job's GITHUB_TOKEN</text>
  <text class="s" x="70" y="272">queues each job</text>
  <text class="s" x="70" y="286">to a free runner</text>
  <text class="s a" x="590" y="272" text-anchor="end">each job: push · draft PR</text>
  <text class="m" x="590" y="286" text-anchor="end">GITHUB_TOKEN</text>

  <rect class="band" x="12" y="288" width="616" height="498" rx="6"/>
  <text class="eb" x="320" y="307" text-anchor="middle">VPS · shared Debian box, Docker · runner pool</text>
  <rect class="box" x="24" y="316" width="292" height="340" rx="4"/>
  <text class="t b" x="36" y="336">runner 1</text>
  <text class="s" x="304" y="336" text-anchor="end">systemd service · one job at a time</text>
  <rect class="group" x="36" y="348" width="268" height="298" rx="4"/>
  <text class="eb" x="48" y="366">job · feat/x · own Docker network</text>
  <rect class="box" x="48" y="378" width="244" height="50" rx="4"/>
  <text class="t b" x="56" y="394">postgres</text>
  <text class="s" x="116" y="394">service container · compose</text>
  <text class="s" x="56" y="408">health-checked · hostname postgres</text>
  <text class="s" x="56" y="421">no published ports</text>
  <line class="ln" x1="170" y1="446" x2="170" y2="430" marker-end="url(#ak)"/>
  <rect class="box hot" x="48" y="446" width="244" height="190" rx="4"/>
  <text class="t b" x="56" y="464">job container · agent image</text>
  <text class="s" x="56" y="478">checkout feat/x · unprivileged user</text>
  <text class="eb" x="56" y="495">processes, not containers</text>
  <rect class="soft" x="56" y="502" width="228" height="28" rx="3"/>
  <text class="m" x="64" y="514">claude --bg --remote-control</text>
  <text class="s" x="64" y="525">the session, on feat/x</text>
  <rect class="box" x="56" y="534" width="228" height="28" rx="3"/>
  <text class="m" x="64" y="546">nest start --watch</text>
  <text class="s" x="64" y="557">API · from the repo's instructions</text>
  <rect class="box" x="56" y="566" width="228" height="28" rx="3"/>
  <text class="m" x="64" y="578">expo start --web</text>
  <text class="s" x="64" y="589">web dev server</text>
  <rect class="box" x="56" y="598" width="228" height="28" rx="3"/>
  <text class="m" x="64" y="610">chromium --headless</text>
  <text class="s" x="64" y="621">via the chrome-devtools MCP</text>
  <rect class="box" x="324" y="316" width="292" height="340" rx="4"/>
  <text class="t b" x="336" y="336">runner 2</text>
  <text class="s" x="604" y="336" text-anchor="end">systemd service · one job at a time</text>
  <rect class="group" x="336" y="348" width="268" height="298" rx="4"/>
  <text class="eb" x="348" y="366">job · feat/y · own Docker network</text>
  <rect class="box" x="348" y="378" width="244" height="50" rx="4"/>
  <text class="t b" x="356" y="394">postgres</text>
  <text class="s" x="416" y="394">service container · compose</text>
  <text class="s" x="356" y="408">health-checked · hostname postgres</text>
  <text class="s" x="356" y="421">no published ports</text>
  <line class="ln" x1="470" y1="446" x2="470" y2="430" marker-end="url(#ak)"/>
  <rect class="box hot" x="348" y="446" width="244" height="190" rx="4"/>
  <text class="t b" x="356" y="464">job container · agent image</text>
  <text class="s" x="356" y="478">checkout feat/y · unprivileged user</text>
  <text class="eb" x="356" y="495">processes, not containers</text>
  <rect class="soft" x="356" y="502" width="228" height="28" rx="3"/>
  <text class="m" x="364" y="514">claude --bg --remote-control</text>
  <text class="s" x="364" y="525">the session, on feat/y</text>
  <rect class="box" x="356" y="534" width="228" height="28" rx="3"/>
  <text class="m" x="364" y="546">nest start --watch</text>
  <text class="s" x="364" y="557">API · from the repo's instructions</text>
  <rect class="box" x="356" y="566" width="228" height="28" rx="3"/>
  <text class="m" x="364" y="578">expo start --web</text>
  <text class="s" x="364" y="589">web dev server</text>
  <rect class="box" x="356" y="598" width="228" height="28" rx="3"/>
  <text class="m" x="364" y="610">chromium --headless</text>
  <text class="s" x="364" y="621">via the chrome-devtools MCP</text>

  <path class="ln" d="M170,672 H470"/>
  <line class="ln" x1="170" y1="672" x2="170" y2="638" marker-end="url(#ak)"/>
  <line class="ln" x1="470" y1="672" x2="470" y2="638" marker-end="url(#ak)"/>
  <line class="ln" x1="170" y1="696" x2="170" y2="672"/>
  <line class="ln" x1="470" y1="696" x2="470" y2="672"/>
  <rect class="box" x="24" y="696" width="292" height="36" rx="4"/>
  <text class="m" x="32" y="711">/opt/agent/home</text>
  <text class="s" x="32" y="725">rw · agent $HOME: login · settings · rules · skills</text>
  <rect class="box" x="324" y="696" width="292" height="36" rx="4"/>
  <text class="m" x="332" y="711">/opt/agent/seed</text>
  <text class="s" x="332" y="725">ro · plugins</text>
  <text class="s" x="24" y="749">only shared: these two host mounts and the runner pool</text>
  <text class="s" x="24" y="762">no job container holds a key or token that can push;</text>
  <text class="s" x="24" y="775">the runner's steps push after the session</text>

  <rect class="box" x="217" y="798" width="206" height="60" rx="4"/>
  <text class="t b" x="229" y="818">Claude app</text>
  <text class="s" x="229" y="833">Remote Control · Code → repo/branch</text>
  <text class="s" x="229" y="847">watch · answer · stop either session</text>
  <path class="ln ln-a dash" d="M320,798 V516 H286" marker-end="url(#aa)"/>
  <path class="ln ln-a dash" d="M320,516 H354" marker-end="url(#aa)"/>
  <rect class="halo" x="238" y="678" width="164" height="13"/>
  <text class="s" x="320" y="688" text-anchor="middle">mounted into every job container</text>

  <line class="ln" x1="260" y1="98" x2="260" y2="163" marker-end="url(#ak)"/>
  <line class="ln" x1="60" y1="236" x2="60" y2="315" marker-end="url(#ak)"/>
  <line class="ln ln-a" x1="600" y1="316" x2="600" y2="237" marker-end="url(#aa)"/>
</svg>

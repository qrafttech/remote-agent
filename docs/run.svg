<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 616" width="560" height="616" role="img" aria-label="A run in six steps: the developer pushes a branch and runs gh workflow run, or its cloud alias; GitHub only queues the job to a free runner and later takes the pushed branch and draft PR; everything else runs on the VPS host, not in GitHub. The runner, a process on the host, checks out the branch, brings the project's docker-compose.yml up with docker compose if it declares one, and starts the agent container with docker run; the session runs claude with Remote Control and works; when it ends, always-run steps on the host take the containers down, commit leftovers, push and open a draft PR; the developer pulls, reviews and marks the PR ready.">
<style>
:root{--bg:#F4F6F3;--surface:#FFFFFF;--band:#EBEEEA;--ink:#1B2126;--muted:#5C676D;--line:#B4BCB8;--accent:#1A6E7A;--accent-soft:#DDEFF1}
@media (prefers-color-scheme:dark){:root{--bg:#14191C;--surface:#1E2528;--band:#191F22;--ink:#E3E8E5;--muted:#9AA5A9;--line:#3B464B;--accent:#62C6D1;--accent-soft:#17333A}}
.bg{fill:var(--bg)}
.band{fill:var(--band);stroke:var(--line);stroke-width:1}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.hot{stroke:var(--accent);stroke-width:1.5}
.soft{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.group{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--ink);stroke-width:1.2}
.ln-a{stroke:var(--accent)}
.dash{stroke-dasharray:5 4}
.life{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.halo{fill:var(--bg)}
.mk{fill:var(--ink)}.mk-a{fill:var(--accent)}
.t{font:12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.t.b{font-weight:600}
.m{font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
.s{font:10px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--muted)}
.a{fill:var(--accent)}
.eb{font:600 9.5px system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.09em;text-transform:uppercase;fill:var(--muted)}
.num circle{fill:var(--ink)}.num text{font:600 10px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--bg)}
</style>
  <defs>
    <marker id="bk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
    <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
  </defs>
  <rect class="bg" width="560" height="616"/>

  <line class="life" x1="80" y1="36" x2="80" y2="608"/>
  <line class="life" x1="230" y1="36" x2="230" y2="608"/>
  <line class="life" x1="370" y1="36" x2="370" y2="608"/>
  <line class="life" x1="500" y1="36" x2="500" y2="608"/>

  <rect class="box" x="30" y="8" width="100" height="28" rx="4"/>
  <text class="t b" x="80" y="26" text-anchor="middle">Developer</text>
  <rect class="box" x="180" y="8" width="100" height="28" rx="4"/>
  <text class="t b" x="230" y="26" text-anchor="middle">GitHub</text>
  <rect class="box" x="320" y="8" width="100" height="28" rx="4"/>
  <text class="t b" x="370" y="26" text-anchor="middle">Runner · VPS</text>
  <rect class="box hot" x="450" y="8" width="100" height="28" rx="4"/>
  <text class="t b" x="500" y="26" text-anchor="middle">Session</text>

  <g class="num"><circle cx="20" cy="84" r="9"/><text x="20" y="87.5" text-anchor="middle">1</text></g>
  <rect class="halo" x="76" y="48" width="158" height="14"/>
  <text class="t" x="155" y="59" text-anchor="middle">git push · clean, committed</text>
  <line class="ln" x1="80" y1="64" x2="228" y2="64" marker-end="url(#bk)"/>
  <rect class="halo" x="70" y="72" width="170" height="42"/>
  <text class="m" x="155" y="83" text-anchor="middle">gh workflow run cloud</text>
  <text class="m" x="155" y="96" text-anchor="middle">--ref feat/x -f prompt="…"</text>
  <text class="m a" x="155" y="110" text-anchor="middle">= cloud feat/x "…"</text>
  <line class="ln" x1="80" y1="116" x2="228" y2="116" marker-end="url(#bk)"/>

  <g class="num"><circle cx="20" cy="146" r="9"/><text x="20" y="149.5" text-anchor="middle">2</text></g>
  <rect class="halo" x="213" y="130" width="174" height="14"/>
  <text class="t" x="300" y="141" text-anchor="middle">queues the job → a free runner</text>
  <line class="ln" x1="230" y1="146" x2="368" y2="146" marker-end="url(#bk)"/>

  <g class="num"><circle cx="20" cy="199" r="9"/><text x="20" y="202.5" text-anchor="middle">3</text></g>
  <rect class="box" x="284" y="166" width="180" height="72" rx="4"/>
  <text class="s" x="294" y="184">checkout feat/x</text>
  <text class="s" x="294" y="199">docker compose up, if any:</text>
  <text class="s" x="294" y="213">a Postgres sidecar, or none</text>
  <text class="s" x="294" y="228">docker run: agent container</text>

  <g class="num"><circle cx="20" cy="298" r="9"/><text x="20" y="301.5" text-anchor="middle">4</text></g>
  <rect class="halo" x="353" y="244" width="164" height="14"/>
  <text class="t" x="435" y="255" text-anchor="middle">sandbox off · MCP on · start</text>
  <line class="ln" x1="370" y1="260" x2="498" y2="260" marker-end="url(#bk)"/>
  <rect class="soft" x="414" y="272" width="142" height="142" rx="4"/>
  <text class="m" x="422" y="290">claude --bg</text>
  <text class="m" x="422" y="304">--remote-control</text>
  <text class="s" x="422" y="322">starts, as processes</text>
  <text class="s" x="422" y="335">in its container:</text>
  <text class="s" x="422" y="348">the API server</text>
  <text class="s" x="422" y="361">the web dev server</text>
  <text class="s" x="422" y="377">drives headless Chromium</text>
  <text class="s" x="422" y="390">via the MCP</text>
  <text class="s" x="422" y="406">works · commits as it goes</text>
  <line class="ln ln-a dash" x1="82" y1="336" x2="412" y2="336" marker-start="url(#ba)" marker-end="url(#ba)"/>
  <rect class="halo" x="135" y="320" width="256" height="14"/>
  <text class="t a" x="263" y="331" text-anchor="middle">Claude app: watch · answer · stop (optional)</text>

  <g class="num"><circle cx="20" cy="488" r="9"/><text x="20" y="491.5" text-anchor="middle">5</text></g>
  <rect class="halo" x="341" y="418" width="188" height="14"/>
  <text class="t" x="435" y="429" text-anchor="middle">ends: done · stopped · cancelled</text>
  <line class="ln" x1="498" y1="434" x2="372" y2="434" marker-end="url(#bk)"/>
  <rect class="box" x="284" y="446" width="180" height="84" rx="4"/>
  <text class="s" x="294" y="464">always-run steps:</text>
  <text class="s" x="294" y="478">compose down · containers gone</text>
  <text class="s" x="294" y="492">commit leftovers as</text>
  <text class="m" x="294" y="506">run: feat/x</text>
  <text class="s" x="294" y="520">push · draft PR (or reuse)</text>
  <rect class="halo" x="196" y="538" width="210" height="14"/>
  <text class="t" x="300" y="549" text-anchor="middle">branch + draft PR · none if unchanged</text>
  <line class="ln ln-a" x1="368" y1="554" x2="232" y2="554" marker-end="url(#ba)"/>

  <g class="num"><circle cx="20" cy="578" r="9"/><text x="20" y="581.5" text-anchor="middle">6</text></g>
  <rect class="halo" x="60" y="570" width="190" height="14"/>
  <text class="t" x="155" y="581" text-anchor="middle">git pull · review · mark PR ready</text>
  <line class="ln" x1="80" y1="586" x2="228" y2="586" marker-end="url(#bk)"/>
</svg>

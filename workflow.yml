name: cloud

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: What the session does; a session already named after the branch is resumed with it
        required: false
        default: Continue where you left off.
        type: string
      fresh:
        description: Start a new session even when one is named after the branch
        required: false
        default: false
        type: boolean

concurrency: cloud-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 1380
    # The project's configuration: the keys of its .env.example files, each service of docker-compose.yml at its service name, dev values only; a real one is a repository secret.
    env:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: qrafttech/remote-agent@main
        with:
          prompt: ${{ inputs.prompt }}
          fresh: ${{ inputs.fresh }}
          token: ${{ secrets.CLOUD_TOKEN || github.token }}

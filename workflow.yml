name: cloud

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: What the session does
        required: true
        type: string

concurrency: cloud-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 1380
    container:
      image: ghcr.io/qrafttech/agent
      volumes:
        - /opt/agent/home:/home/agent
        - /opt/agent/seed:/opt/seed:ro
      env:
        CLAUDE_CODE_PLUGIN_SEED_DIR: /opt/seed
    # The project's sidecars: each service of docker-compose.yml, under the same name, with its healthcheck; no ports.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 5
    # The project's configuration: the keys of its .env.example files, each sidecar at its service name, dev values only; a real one is a repository secret.
    env:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          HOME: /home/agent
          PROMPT: ${{ inputs.prompt }}
        run: session "${GITHUB_REPOSITORY#*/}/$GITHUB_REF_NAME" "$PROMPT"
      - if: always()
        env:
          PROMPT: ${{ inputs.prompt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git diff --cached --quiet || git commit -qm "run: $GITHUB_REF_NAME"
          [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] || { echo "no changes on $GITHUB_REF_NAME"; exit 0; }
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          gh pr list --head "$GITHUB_REF_NAME" --json url -q '.[].url' | grep . ||
            gh pr create --draft --head "$GITHUB_REF_NAME" --title "$(head -1 <<<"$PROMPT" | cut -c1-72)" --body "$PROMPT"

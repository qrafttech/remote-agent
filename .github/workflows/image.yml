name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash test.sh
      - run: bash test.sh image
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag agent-test "ghcr.io/$GITHUB_REPOSITORY_OWNER/agent"
          docker push "ghcr.io/$GITHUB_REPOSITORY_OWNER/agent"

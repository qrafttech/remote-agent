services:
  agent:
    image: agent
    volumes:
      - ${AGENT_ROOT}/home:/home/agent
      - ${AGENT_ROOT}/cloud:/usr/local/bin/cloud:ro
      - ${PROJECT_DIR}:${PROJECT_DIR}
      - ${AGENT_ROOT}/seed:/opt/seed:ro
    working_dir: ${PROJECT_DIR}
    environment:
      CLAUDE_CODE_PLUGIN_SEED_DIR: /opt/seed
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
